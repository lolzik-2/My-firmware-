name: Build Cardputer Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install M5Stack ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32

      - name: Install required libraries
        run: |
          arduino-cli lib install "M5Cardputer"
          arduino-cli lib install "IRremoteESP8266"
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_cardputer \
            --build-property build.partitions=huge_app \
            --build-property upload.maximum_size=3145728 \
            --build-property compiler.c.elf.extra_flags="-Wl,--allow-multiple-definition" \
            --output-dir ./build \
            .

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-firmware
          path: ./build/*.bin
          if-no-files-found: error
